{% extends "base.html" %}
{% block title %}Sync Hub — Filament Manager{% endblock %}
{% block content %}
<section id="sync-page">
  <header class="page-header">
    <div>
      <p class="eyebrow">Sync</p>
      <h1>Sync Hub</h1>
      <p>Orca Cloud is the sole source of presets. Push cached presets to your printer and manage sync targets.</p>
    </div>
  </header>

  <style>
    .sync-hub-grid { display: grid; grid-template-columns: minmax(0, 2fr) minmax(280px, 1fr); gap: 24px; margin-bottom: 24px; }
    .sync-hub-left { display: flex; flex-direction: column; gap: 24px; min-width: 0; }
    .sync-hub-right { display: flex; flex-direction: column; gap: 24px; min-width: 0; }
    .target-card { padding: 24px 28px; }
    .target-card .eyebrow { margin-bottom: 8px; }
    .target-card h2 { margin-bottom: 8px; }
    .target-card p { margin: 0 0 16px; font-size: 13px; }
    .target-card .button { width: 100%; }
    .target-status { display: flex; gap: 12px; margin-bottom: 16px; font-size: 12px; color: var(--text-secondary); }
    .target-status span { display: inline-flex; align-items: center; gap: 5px; }
    .target-head { display: flex; align-items: center; gap: 16px; margin-bottom: 20px; }
    .target-head .eyebrow { margin-bottom: 4px; }
    .target-head h2 { margin: 0; }
    .target-summary { display: block; margin-bottom: 8px; color: var(--text); font: 700 18px/1.3 var(--font-heading, inherit); }
    .row-actions { display: inline-flex; flex-wrap: nowrap; gap: 6px; justify-content: flex-end; white-space: nowrap; }
    .row-actions .button { min-height: 32px; padding: 6px 10px; font-size: 11px; width: auto; }
    @media (max-width: 1200px) { .sync-hub-grid { grid-template-columns: 1fr; } .sync-hub-right { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); } }
    @media (max-width: 900px) { .sync-hub-right { grid-template-columns: 1fr; } }
    #busy-dialog { padding: 20px 24px; }
    /* Action modal overlay — scoped to #action-modal */
    #action-modal { position: fixed; inset: 0; z-index: 2000; display: flex; align-items: center; justify-content: center; background: rgba(1,5,17,.7); -webkit-backdrop-filter: blur(4px); backdrop-filter: blur(4px); }
    #action-modal[hidden] { display: none; }
    .push-modal-dialog { width: min(480px, 90vw); padding: 32px; border: 1px solid var(--border-strong); border-radius: var(--radius-card); background: var(--surface); box-shadow: 0 24px 60px rgba(0,0,0,.5); }
    .push-modal-body { text-align: center; }
    .push-modal-state { display: flex; flex-direction: column; align-items: center; gap: 12px; }
    .push-modal-busy-detail { color: var(--text-secondary); font-size: 13px; font-weight: 600; }
    .push-modal-body h3 { margin: 0; font-size: 18px; }
    .push-modal-body p { margin: 0; }
    .push-modal-sub { color: var(--text-muted); font-size: 11px; }
    .push-modal-icon { display: grid; width: 40px; height: 40px; place-items: center; border-radius: 50%; font-size: 20px; font-weight: 700; }
    .push-modal-icon-ok { background: rgba(5,193,104,.15); color: var(--green); }
    .push-modal-icon-err { background: rgba(255,90,101,.15); color: #ff8d95; }
    .push-modal-error-msg { color: #ff8d95; font-size: 13px; overflow-wrap: anywhere; }
    .push-modal-awaiting .button-group { justify-content: center; margin-top: 8px; }
  </style>

  <div id="sync-hub-content">
    {% include "_sync_hub_grid.html" %}
  </div>

</section>

<div id="action-modal" hidden role="dialog" aria-modal="true" aria-label="Sync operation" tabindex="-1">
  <div class="push-modal-dialog">
    <div id="action-modal-body" class="push-modal-body" aria-live="polite">
      <div class="push-modal-state">
        <div class="spinner spinner-lg"></div>
        <p>Starting…</p>
      </div>
    </div>
  </div>
</div>
<script>
function openActionModal() {
  var m = document.getElementById('action-modal');
  if (!m) return;
  _actionModalPriorFocus = document.activeElement;
  m.removeAttribute('hidden');
  m.focus();
  var b = document.getElementById('action-modal-body');
  if (b) b.innerHTML = '<div class="push-modal-state"><div class="spinner spinner-lg"></div><p>Starting…</p></div>';
  document.addEventListener('keydown', _actionModalKeydown);
}
function closeActionModal() {
  var m = document.getElementById('action-modal');
  if (!m) return;
  m.setAttribute('hidden', '');
  document.removeEventListener('keydown', _actionModalKeydown);
  if (_actionModalPriorFocus && _actionModalPriorFocus.focus) _actionModalPriorFocus.focus();
  _actionModalPriorFocus = null;
}
var _actionModalPriorFocus = null;
function _actionModalKeydown(e) {
  if (e.key !== 'Escape') return;
  var m = document.getElementById('action-modal');
  if (!m || m.hasAttribute('hidden')) return;
  var body = document.getElementById('action-modal-body');
  if (body && body.querySelector('.spinner')) return;
  closeActionModal();
}
document.getElementById('action-modal').addEventListener('click', function(e) {
  if (e.target !== this) return;
  var body = document.getElementById('action-modal-body');
  if (body && body.querySelector('.spinner')) return;
  closeActionModal();
});
</script>
{% endblock %}
