{% extends "base.html" %}
{% block title %}Sync Hub — Filament Manager{% endblock %}
{% block content %}
<section id="sync-page">
  <header class="page-header">
    <div>
      <p class="eyebrow">Sync</p>
      <h1>Sync Hub</h1>
      <p>Orca Cloud is the sole source of presets. Push cached presets to your printer and manage sync targets.</p>
    </div>
  </header>

  <style>
    .sync-hub-grid { display: grid; grid-template-columns: minmax(0, 2fr) minmax(280px, 1fr); gap: 24px; margin-bottom: 24px; }
    .sync-hub-left { display: flex; flex-direction: column; gap: 24px; min-width: 0; }
    .sync-hub-right { display: flex; flex-direction: column; gap: 24px; min-width: 0; }
    .target-card { padding: 24px 28px; }
    .target-card .eyebrow { margin-bottom: 8px; }
    .target-card h2 { margin-bottom: 8px; }
    .target-card p { margin: 0 0 16px; font-size: 13px; }
    .target-card .button { width: 100%; }
    .target-status { display: flex; gap: 12px; margin-bottom: 16px; font-size: 12px; color: var(--text-secondary); }
    .target-status span { display: inline-flex; align-items: center; gap: 5px; }
    .target-head { display: flex; align-items: center; gap: 16px; margin-bottom: 20px; }
    .target-head .eyebrow { margin-bottom: 4px; }
    .target-head h2 { margin: 0; }
    .target-summary { display: block; margin-bottom: 8px; color: var(--text); font: 700 18px/1.3 var(--font-heading, inherit); }
    .row-actions { display: inline-flex; flex-wrap: nowrap; gap: 6px; justify-content: flex-end; white-space: nowrap; }
    .row-actions .button { min-height: 32px; padding: 6px 10px; font-size: 11px; width: auto; }
    @media (max-width: 1200px) { .sync-hub-grid { grid-template-columns: 1fr; } .sync-hub-right { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); } }
    @media (max-width: 900px) { .sync-hub-right { grid-template-columns: 1fr; } }
    #busy-dialog { padding: 20px 24px; }
    /* Action modal overlay — scoped to #action-modal */
    #action-modal { position: fixed; inset: 0; z-index: 2000; display: flex; align-items: center; justify-content: center; background: rgba(1,5,17,.7); -webkit-backdrop-filter: blur(4px); backdrop-filter: blur(4px); }
    #action-modal[hidden] { display: none; }
    .push-modal-dialog { width: min(480px, 90vw); padding: 32px; border: 1px solid var(--border-strong); border-radius: var(--radius-card); background: var(--surface); box-shadow: 0 24px 60px rgba(0,0,0,.5); }
    .push-modal-body { text-align: center; }
    .push-modal-state { display: flex; flex-direction: column; align-items: center; gap: 12px; }
    .push-modal-busy-detail { color: var(--text-secondary); font-size: 13px; font-weight: 600; }
    .push-modal-body h3 { margin: 0; font-size: 18px; }
    .push-modal-body p { margin: 0; }
    .push-modal-sub { color: var(--text-muted); font-size: 11px; }
    .push-modal-icon { display: grid; width: 40px; height: 40px; place-items: center; border-radius: 50%; font-size: 20px; font-weight: 700; }
    .push-modal-icon-ok { background: rgba(5,193,104,.15); color: var(--green); }
    .push-modal-icon-err { background: rgba(255,90,101,.15); color: #ff8d95; }
    .push-modal-error-msg { color: #ff8d95; font-size: 13px; overflow-wrap: anywhere; }
    .push-modal-awaiting .button-group { justify-content: center; margin-top: 8px; }
    /* Diff modal overlay — same pattern as #action-modal */
    #diff-modal { position: fixed; inset: 0; z-index: 2000; display: flex; align-items: center; justify-content: center; background: rgba(1,5,17,.7); -webkit-backdrop-filter: blur(4px); backdrop-filter: blur(4px); }
     #diff-modal[hidden] { display: none; }
    /* Context menu for preset table rows */
    #preset-context-menu {
      position: fixed;
      z-index: 2500;
      min-width: 200px;
      padding: 6px;
      border: 1px solid var(--border-strong);
      border-radius: var(--radius-card);
      background: var(--surface-raised);
      box-shadow: 0 12px 32px rgba(0, 0, 0, .55), var(--shadow-card);
    }
    #preset-context-menu[hidden] { display: none; }
    .context-menu-item {
      display: flex;
      align-items: center;
      width: 100%;
      padding: 8px 12px;
      border: 0;
      border-radius: var(--radius-input);
      background: transparent;
      color: var(--text);
      font-size: 13px;
      font-weight: 500;
      text-align: left;
      cursor: pointer;
      transition: background .12s ease, color .12s ease;
    }
    .context-menu-item:hover {
      background: rgba(203, 60, 255, .15);
      color: var(--text);
    }
    .context-menu-item.danger {
      color: var(--red, #ff5a65);
    }
    .context-menu-item.danger:hover {
      background: rgba(255, 90, 101, .15);
      color: var(--red, #ff8d95);
    }
    .context-menu-divider {
      height: 1px;
      margin: 4px 0;
      background: var(--border-subtle, rgba(255, 255, 255, .08));
    }
   </style>

  <div id="sync-hub-content">
    {% include "_sync_hub_grid.html" %}
  </div>

</section>

<div id="action-modal" hidden role="dialog" aria-modal="true" aria-label="Sync operation" tabindex="-1">
  <div class="push-modal-dialog">
    <div id="action-modal-body" class="push-modal-body" aria-live="polite">
      <div class="push-modal-state">
        <div class="spinner spinner-lg"></div>
        <p>Starting…</p>
      </div>
    </div>
  </div>
</div>
<div id="diff-modal" hidden role="dialog" aria-modal="true" aria-label="Preset diff" tabindex="-1">
  <div class="diff-modal-dialog">
    <div id="diff-modal-body" class="diff-modal-body" aria-live="polite">
      <div class="push-modal-state"><div class="spinner spinner-lg"></div><p>Loading…</p></div>
    </div>
  </div>
</div>
<div id="preset-context-menu" hidden role="menu" aria-label="Preset actions" tabindex="-1">
  <button type="button" class="context-menu-item" id="context-menu-push" role="menuitem">
    <span>⬆ Push to Printer</span>
  </button>
  <button type="button" class="context-menu-item" id="context-menu-compare" role="menuitem">
    <span>⚖ Compare</span>
  </button>
  <div class="context-menu-divider" id="context-menu-divider-ignore"></div>
  <button type="button" class="context-menu-item" id="context-menu-toggle-ignore" role="menuitem">
    <span id="context-menu-toggle-label">🚫 Vom Sync ausschließen</span>
  </button>
  <div class="context-menu-divider" id="context-menu-divider-remove"></div>
  <button type="button" class="context-menu-item danger" id="context-menu-remove" role="menuitem">
    <span>🗑 Remove from printer DB</span>
  </button>
</div>
<script>
function openActionModal() {
  var m = document.getElementById('action-modal');
  if (!m) return;
  _actionModalPriorFocus = document.activeElement;
  m.removeAttribute('hidden');
  m.focus();
  var b = document.getElementById('action-modal-body');
  if (b) b.innerHTML = '<div class="push-modal-state"><div class="spinner spinner-lg"></div><p>Starting…</p></div>';
  document.addEventListener('keydown', _actionModalKeydown);
}
function closeActionModal() {
  var m = document.getElementById('action-modal');
  if (!m) return;
  m.setAttribute('hidden', '');
  document.removeEventListener('keydown', _actionModalKeydown);
  if (_actionModalPriorFocus && _actionModalPriorFocus.focus) _actionModalPriorFocus.focus();
  _actionModalPriorFocus = null;
}
var _actionModalPriorFocus = null;
function _actionModalKeydown(e) {
  if (e.key !== 'Escape') return;
  var m = document.getElementById('action-modal');
  if (!m || m.hasAttribute('hidden')) return;
  var body = document.getElementById('action-modal-body');
  if (body && body.querySelector('.spinner')) return;
  closeActionModal();
}
document.getElementById('action-modal').addEventListener('click', function(e) {
  if (e.target !== this) return;
  var body = document.getElementById('action-modal-body');
  if (body && body.querySelector('.spinner')) return;
  closeActionModal();
});
var _diffModalPriorFocus = null;
function openDiffModal() {
  var m = document.getElementById('diff-modal');
  if (!m) return;
  _diffModalPriorFocus = document.activeElement;
  m.removeAttribute('hidden');
  m.focus();
  var b = document.getElementById('diff-modal-body');
  if (b) b.innerHTML = '<div class="push-modal-state"><div class="spinner spinner-lg"></div><p>Comparing…</p></div>';
  document.addEventListener('keydown', _diffModalKeydown);
}
function closeDiffModal() {
  var m = document.getElementById('diff-modal');
  if (!m) return;
  m.setAttribute('hidden', '');
  document.removeEventListener('keydown', _diffModalKeydown);
  if (_diffModalPriorFocus && _diffModalPriorFocus.focus) _diffModalPriorFocus.focus();
  _diffModalPriorFocus = null;
}
function _diffModalKeydown(e) {
  if (e.key !== 'Escape') return;
  var m = document.getElementById('diff-modal');
  if (!m || m.hasAttribute('hidden')) return;
  var body = document.getElementById('diff-modal-body');
  if (body && body.querySelector('.spinner')) return;
  closeDiffModal();
}
document.getElementById('diff-modal').addEventListener('click', function(e) {
  if (e.target !== this) return;
  var body = document.getElementById('diff-modal-body');
  if (body && body.querySelector('.spinner')) return;
  closeDiffModal();
});
function toggleDiffOnly(cb) {
  var body = document.getElementById('diff-modal-body');
  if (!body) return;
  body.classList.toggle('diff-only', cb.checked);
  body.querySelectorAll('.diff-cat').forEach(function(cat) {
    var row = cat.nextElementSibling;
    var anyVisible = false;
    while (row && !row.classList.contains('diff-cat')) {
      if (!cb.checked || !row.classList.contains('diff-row-same')) anyVisible = true;
      row = row.nextElementSibling;
    }
    cat.style.display = anyVisible ? '' : 'none';
  });
}

/* ── Context Menu for Preset Rows ── */
var _activeContextCloudId = null;
var _activeContextStatus = null;
var _activeContextPrinterDbId = null;
var _activeContextName = null;

function closePresetContextMenu() {
  var menu = document.getElementById('preset-context-menu');
  if (!menu || menu.hasAttribute('hidden')) return;
  menu.setAttribute('hidden', '');
  _activeContextCloudId = null;
  _activeContextStatus = null;
  _activeContextPrinterDbId = null;
  _activeContextName = null;
}

document.addEventListener('contextmenu', function(e) {
  var row = e.target.closest('#preset-table tbody tr');
  if (!row) {
    closePresetContextMenu();
    return;
  }
  var cloudId = row.dataset.cloudId;
  if (!cloudId) return;
  e.preventDefault();

  _activeContextCloudId = cloudId;
  _activeContextStatus = row.dataset.status || '';
  _activeContextPrinterDbId = row.dataset.printerDbId || '';
  _activeContextName = row.dataset.name || '';

  var pushItem = document.getElementById('context-menu-push');
  var compareItem = document.getElementById('context-menu-compare');
  var ignoreItem = document.getElementById('context-menu-toggle-ignore');
  var removeItem = document.getElementById('context-menu-remove');
  var dividerIgnore = document.getElementById('context-menu-divider-ignore');
  var dividerRemove = document.getElementById('context-menu-divider-remove');
  var label = document.getElementById('context-menu-toggle-label');

  if (_activeContextStatus === 'orphan') {
    if (pushItem) pushItem.style.display = 'none';
    if (compareItem) compareItem.style.display = 'none';
    if (ignoreItem) ignoreItem.style.display = 'none';
    if (dividerIgnore) dividerIgnore.style.display = 'none';
    if (removeItem) removeItem.style.display = _activeContextPrinterDbId ? '' : 'none';
    if (dividerRemove) dividerRemove.style.display = 'none';
  } else if (_activeContextStatus === 'ignored') {
    if (pushItem) pushItem.style.display = 'none';
    if (compareItem) compareItem.style.display = '';
    if (ignoreItem) ignoreItem.style.display = '';
    if (dividerIgnore) dividerIgnore.style.display = '';
    if (label) label.textContent = '✓ Sync wieder aktivieren';
    if (removeItem) removeItem.style.display = 'none';
    if (dividerRemove) dividerRemove.style.display = 'none';
  } else {
    if (pushItem) pushItem.style.display = '';
    if (compareItem) compareItem.style.display = '';
    if (ignoreItem) ignoreItem.style.display = '';
    if (dividerIgnore) dividerIgnore.style.display = '';
    if (label) label.textContent = '🚫 Vom Sync ausschließen';
    if (removeItem) removeItem.style.display = 'none';
    if (dividerRemove) dividerRemove.style.display = 'none';
  }

  var menu = document.getElementById('preset-context-menu');
  if (!menu) return;
  menu.removeAttribute('hidden');

  // Position menu nicely within viewport
  var x = e.clientX;
  var y = e.clientY;
  var menuWidth = menu.offsetWidth || 220;
  var menuHeight = menu.offsetHeight || 120;
  if (x + menuWidth > window.innerWidth) x = Math.max(10, window.innerWidth - menuWidth - 10);
  if (y + menuHeight > window.innerHeight) y = Math.max(10, window.innerHeight - menuHeight - 10);
  menu.style.left = x + 'px';
  menu.style.top = y + 'px';
});

document.getElementById('context-menu-compare').addEventListener('click', function() {
  if (!_activeContextCloudId) return;
  var cloudId = _activeContextCloudId;
  closePresetContextMenu();
  openDiffModal();
  if (window.htmx) {
    htmx.ajax('POST', '/sync/compare-modal', {
      values: {preset_a_id: cloudId},
      target: '#diff-modal-body',
      swap: 'innerHTML'
    });
  }
});

document.getElementById('context-menu-push').addEventListener('click', function() {
  if (!_activeContextCloudId) return;
  var cloudId = _activeContextCloudId;
  closePresetContextMenu();
  openActionModal();
  if (window.htmx) {
    htmx.ajax('POST', '/sync/push-modal', {
      values: {cloud_resource_ids: cloudId},
      target: '#action-modal-body',
      swap: 'innerHTML'
    });
  }
});

document.getElementById('context-menu-toggle-ignore').addEventListener('click', function() {
  if (!_activeContextCloudId) return;
  var cloudId = _activeContextCloudId;
  closePresetContextMenu();
  if (window.htmx) {
    htmx.ajax('POST', '/sync/presets/' + encodeURIComponent(cloudId) + '/toggle-ignore', {
      target: '#sync-hub-content',
      swap: 'innerHTML'
    });
  }
});

document.getElementById('context-menu-remove').addEventListener('click', function() {
  if (!_activeContextPrinterDbId) return;
  var printerDbId = _activeContextPrinterDbId;
  if (!confirm('This removes orphan printer DB entry ' + printerDbId + ' and its SyncTarget. Continue?')) return;
  closePresetContextMenu();
  if (window.htmx) {
    htmx.ajax('POST', '/sync/printer-db/' + encodeURIComponent(printerDbId) + '/remove', {
      values: {confirm: printerDbId},
      target: '#sync-hub-content',
      swap: 'innerHTML'
    });
  }
});

document.addEventListener('click', function(e) {
  var menu = document.getElementById('preset-context-menu');
  if (menu && !menu.hasAttribute('hidden') && !menu.contains(e.target)) {
    closePresetContextMenu();
  }
});

document.addEventListener('keydown', function(e) {
  if (e.key === 'Escape') closePresetContextMenu();
});

window.addEventListener('scroll', closePresetContextMenu, true);
</script>
{% endblock %}
