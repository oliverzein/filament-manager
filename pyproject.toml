# pyproject.toml
[project]
name = "filament-manager"
version = "2.1.3"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115", "uvicorn[standard]", "sqlalchemy>=2.0",
                "jinja2", "python-multipart", "websocket-client", "requests", "pytest"]
[tool.setuptools.packages.find]
include = ["fm*"]

[tool.setuptools.package-data]
"*" = ["*.html", "*.css", "*.js", "*.json", "*.svg", "*.png"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore:Using `httpx` with `starlette.testclient`:Warning",
]
